<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш Календар</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 10px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        header { display: flex; flex-direction: column; gap: 12px; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        .user-selector { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: bold; }
        select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; background: #fff; flex-grow: 1; }
        .navigation { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        .btn { padding: 8px 12px; border: none; background-color: #007bff; color: white; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn-today { background-color: #6c757d; }
        .btn-sync { background-color: #28a745; }
        #week-display { font-size: 14px; font-weight: bold; text-align: center; white-space: nowrap; }
        .calendar-grid { display: flex; flex-direction: column; gap: 12px; }
        .day-row { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; cursor: pointer; }
        .day-label { padding: 12px; font-weight: bold; background: #eceff1; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .day-date { font-size: 12px; color: #666; font-weight: normal; }
        .intersections-list { display: flex; flex-direction: column; }
        .intersection-item { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; font-size: 14px; line-height: 1.4; }
        .intersection-item:last-child { border-bottom: none; }
        .no-events { padding: 15px; text-align: center; color: #777; font-size: 14px; }
        .status-bar { font-size: 12px; text-align: center; color: #666; margin-top: 5px; font-style: italic; font-weight: bold; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
        .modal { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; }
        .modal-header { font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .hours-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; max-height: 260px; overflow-y: auto; }
        .hour-checkbox { display: flex; align-items: center; gap: 6px; padding: 8px; background: #f0f2f5; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .badge { padding: 2px 6px; border-radius: 4px; color: white; font-size: 11px; font-weight: bold; margin-left: 5px; display: inline-block; }
    </style>
</head>
<body onload="init()">
<div class="container">
    <header>
        <div class="user-selector">
            <label for="user-select">Хто ти:</label>
            <select id="user-select" onchange="changeUser()"></select>
        </div>
        <div class="navigation">
            <button class="btn" onclick="navigateWeek(-1)">◀ Назад</button>
            <button class="btn btn-today" onclick="goToday()">Сьогодні</button>
            <span id="week-display"></span>
            <button class="btn" onclick="navigateWeek(1)">Вперед ▶</button>
        </div>
        <button class="btn btn-sync" onclick="loadFromCloud()">🔄 Оновити</button>
        <div class="status-bar" id="status-bar">Синхронізація...</div>
    </header>
    <div class="calendar-grid" id="calendar-grid"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <div class="modal-header" id="modal-title"></div>
        <div class="hours-grid" id="hours-grid"></div>
        <div class="modal-actions">
            <button class="btn btn-today" onclick="closeModal()">Скасувати</button>
            <button class="btn" onclick="saveHours()">Зберегти зміни</button>
        </div>
    </div>
</div>
<script>
    const FRIENDS = { 'Костя': '#ff4d4d', 'Артур': '#3399ff', 'Богдан': '#2ecc71', 'Роман': '#f39c12', 'Максим': '#9b59b6' };
    const DAYS_NAMES = ['Понеділок', 'Вівторок', 'Середа', 'Четвер', 'П\'ятниця', 'Субота', 'Неділя'];
    
    // ВСТАВТЕ СВОЇ ДАНІ З JSONBIN.IO СЮДИ:
    const BIN_ID = '6ac6c978ac6210605a1dc974 '; 
    const MASTER_KEY = '$2a$10$0DckOuqSYdhx4IbFB8VGI.PrfkjwtU/W3EO1ei16MruskFnlY5F6q';
    const CLOUD_URL = `https://jsonbin.io\${BIN_ID}{BIN_ID}`;

    let currentUser = localStorage.getItem('cal_user') || Object.keys(FRIENDS)[0];
    let currentMonday = getMonday(new Date());
    let selectedDateStr = '';
    let db = {};
    let isModalOpen = false;

    function getMonday(d) {
        d = new Date(d); let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
        return new Date(d.setDate(diff));
    }
    function formatDate(d) { return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`; }
    function formatDateISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    
    function updateStatus(text, color = '#666') { 
        const bar = document.getElementById('status-bar');
        if(bar) { bar.textContent = text; bar.style.color = color; }
    }

    async function loadFromCloud() {
        if (isModalOpen) return;
        try {
            let response = await fetch(`${CLOUD_URL}/latest`, {
                method: 'GET',
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            if (response.ok) {
                let resData = await response.json();
                db = resData.record || {};
                updateStatus('🟢 Онлайн (синхронізовано)', '#28a745');
                renderCalendar();
            } else {
                updateStatus('🟡 Помилка зчитування бази', '#f39c12');
            }
        } catch (e) {
            updateStatus('🔴 Немає зв\'язку з інтернетом', '#ff4d4d');
        }
    }

    async function saveToCloud() {
        updateStatus('🔵 Збереження в інтернет...');
        try {
            let response = await fetch(CLOUD_URL, {
                method: 'PUT',
                body: JSON.stringify(db),
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY }
            });
            if (response.ok) {
                updateStatus('🟢 Збережено для всіх хлопців!', '#28a745');
                renderCalendar();
            } else {
                updateStatus('🔴 Помилка збереження на сервері', '#ff4d4d');
            }
        } catch (e) {
            updateStatus('🔴 Помилка мережі при надсиланні', '#ff4d4d');
        }
    }
    function init() {
        const select = document.getElementById('user-select');
        select.innerHTML = '';
        Object.keys(FRIENDS).forEach(name => {
            let opt = document.createElement('option'); opt.value = name; opt.textContent = name;
            if(name === currentUser) opt.selected = true;
            select.appendChild(opt);
        });
        loadFromCloud();
        setInterval(loadFromCloud, 5000);
    }

    function changeUser() { 
        currentUser = document.getElementById('user-select').value; 
        localStorage.setItem('cal_user', currentUser); 
        renderCalendar(); 
    }
    function navigateWeek(dir) { currentMonday.setDate(currentMonday.getDate() + (dir * 7)); renderCalendar(); }
    function goToday() { currentMonday = getMonday(new Date()); renderCalendar(); }

    function openModal(dateStr, dayName) {
        selectedDateStr = dateStr; isModalOpen = true;
        document.getElementById('modal-title').textContent = `${dayName} (${dateStr})`;
        const grid = document.getElementById('hours-grid'); grid.innerHTML = '';
        let userHours = (db[dateStr] && db[dateStr][currentUser]) || [];

        for(let h = 0; h < 24; h++) {
            let hourStr = `${String(h).padStart(2, '0')}:00`;
            let label = document.createElement('label'); label.className = 'hour-checkbox';
            let cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = hourStr;
            if(userHours.includes(hourStr)) cb.checked = true;
            label.appendChild(cb); label.appendChild(document.createTextNode(hourStr));
            grid.appendChild(label);
        }
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; isModalOpen = false; }

    function saveHours() {
        const grid = document.getElementById('hours-grid');
        const checkboxes = grid.querySelectorAll('input[type="checkbox"]');
        let selectedHours = [];
        checkboxes.forEach(cb => { if(cb.checked) selectedHours.push(cb.value); });

        if(!db[selectedDateStr]) db[selectedDateStr] = {};
        if(selectedHours.length > 0) { db[selectedDateStr][currentUser] = selectedHours; } 
        else {
            delete db[selectedDateStr][currentUser];
            if(Object.keys(db[selectedDateStr]).length === 0) delete db[selectedDateStr];
        }
        closeModal(); saveToCloud();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
        let sunday = new Date(currentMonday); sunday.setDate(sunday.getDate() + 6);
        document.getElementById('week-display').textContent = `${formatDate(currentMonday)} – ${formatDate(sunday)}`;
        let tempDate = new Date(currentMonday);

        for (let i = 0; i < 7; i++) {
            let dateISO = formatDateISO(tempDate), dateDisplay = formatDate(tempDate), dayName = DAYS_NAMES[i];
            let row = document.createElement('div'); row.className = 'day-row';
            row.onclick = (function(dIso, dName) { return function() { openModal(dIso, dName); }; })(dateISO, dayName);

            let label = document.createElement('div'); label.className = 'day-label';
            label.innerHTML = `${dayName} <span class="day-date">${dateDisplay}</span>`;
            row.appendChild(label);

            let list = document.createElement('div'); list.className = 'intersections-list';
            let dayData = db[dateISO] || {}, hoursMap = {};

            Object.keys(dayData).forEach(user => {
                dayData[user].forEach(h => { if(!hoursMap[h]) hoursMap[h] = []; hoursMap[h].push(user); });
            });

            let sortedHours = Object.keys(hoursMap).sort();
            if(sortedHours.length === 0) { list.innerHTML = `<div class="no-events">Немає запланованого часу</div>`; } 
            else {
                sortedHours.forEach(h => {
                    let users = hoursMap[h], item = document.createElement('div');
                    item.className = 'intersection-item'; item.innerHTML = `<strong>${h}</strong> — `;
                    users.forEach(u => { item.innerHTML += `<span class="badge" style="background:${FRIENDS[u]||'#6c757d'}">${u}</span>`; });
                    list.appendChild(item);
                });
            }
            row.appendChild(list); grid.appendChild(row);
            tempDate.setDate(tempDate.getDate() + 1);
        }
    }
</script>
</body>
</html>
